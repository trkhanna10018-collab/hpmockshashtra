<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Question Preview</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    background: #f4f8fd;
    font-family: Arial, Helvetica, sans-serif;
    color: #1f2937;
}

.question-card {
    max-width: 800px;
    margin: auto;
    background: #fff;
    border: 1px solid #dbe4ef;
    border-radius: 10px;
    padding: 22px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.question-number {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 10px;
}

.question-text {
    font-size: 15px;
    line-height: 1.5;
}

.hindi {
    margin-top: 3px;
    margin-bottom: 12px;
}

.excel-table {
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 14px;
}

.excel-table th,
.excel-table td {
    border: 1px solid #555;
    padding: 7px 18px;
    text-align: center;
}

.excel-table th {
    background: #f1f5f9;
    font-weight: 700;
}

.formula {
    background: #f3f4f6;
    padding: 2px 5px;
    border-radius: 3px;
    font-family: Consolas, monospace;
    font-size: 14px;
}

.options {
    margin-top: 16px;
}

.option {
    padding: 7px 10px;
    margin-bottom: 5px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    background: #fafafa;
}

@media (max-width: 600px) {

    .question-card {
        padding: 16px;
    }

    .question-text {
        font-size: 14px;
    }

    .excel-table {
        font-size: 13px;
    }

    .excel-table th,
    .excel-table td {
        padding: 6px 12px;
    }
}
</style>
</head>

<body>

<div class="question-card">

    <div class="question-number">Q4.</div>

    <div class="question-text">

        Consider the following data in an MS-Excel worksheet:

        <div class="hindi">
            MS-Excel वर्कशीट में निम्नलिखित डेटा पर विचार कीजिए:
        </div>

        <table class="excel-table">
            <tr>
                <th>A</th>
                <th>B</th>
                <th>C</th>
                <th>D</th>
                <th>E</th>
            </tr>
            <tr>
                <td>7</td>
                <td>2</td>
                <td>4</td>
                <td>8</td>
                <td>2</td>
            </tr>
            <tr>
                <td>2</td>
                <td>1</td>
                <td>6</td>
                <td>1</td>
                <td>5</td>
            </tr>
        </table>

        What will be the value of the formula
        <span class="formula">=LARGE(A1:E2,1)+LARGE(A1:E2,2)</span>?

        <div class="hindi">
            सूत्र <span class="formula">=LARGE(A1:E2,1)+LARGE(A1:E2,2)</span>
            का मान क्या होगा?
        </div>

        <div class="options">
            <div class="option"><strong>(A)</strong> 14</div>
            <div class="option"><strong>(B)</strong> 16</div>
            <div class="option"><strong>(C)</strong> 15</div>
            <div class="option"><strong>(D)</strong> 12</div>
        </div>

    </div>

</div>

</body>
</html>
