<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free bilingual practice quiz">
<title>MS Word Practice Test</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#667085;--primary:#2457d6;--soft:#eaf0ff;--border:#dce3ee;--good:#147a43;--goodbg:#e9f8ef;--bad:#b42318;--badbg:#fff0ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.wrap{width:100%;max-width:none;margin:0 auto;padding:18px 24px}.header,.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 26px #1428500d}
.header{padding:22px;margin-bottom:16px}.topline{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(22px,4vw,30px);margin:0 0 8px}.sub{color:var(--muted);margin:0;line-height:1.5}
.pill{border-radius:999px;padding:8px 12px;background:var(--soft);color:var(--primary);font-weight:700;font-size:13px;white-space:nowrap}
.layout{display:block;width:100%;}.panel{padding:20px}
.question-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;margin-bottom:16px}
#questionText{font-size:20px;line-height:1.55;margin:0 0 18px;white-space:pre-line}
.option{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:12px;margin:10px 0;cursor:pointer;line-height:1.5}
.option:hover{border-color:var(--primary);background:#f8faff}.option input{margin-top:5px;accent-color:var(--primary);flex:0 0 auto}
.option.selected{border-color:var(--primary);background:var(--soft)}.option.correct{border-color:var(--good);background:var(--goodbg)}.option.wrong{border-color:var(--bad);background:var(--badbg)}
.letter{font-weight:700;min-width:22px}.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:20px}
button{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{color:#fff;background:var(--primary)}.btn-secondary{color:var(--text);background:#eef1f6}.btn-danger{color:#fff;background:#b42318}
.side-title{font-weight:700;margin:0 0 12px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.result{display:none;margin-top:16px}.score{font-size:28px;font-weight:800;margin:0 0 8px}
.explanation{padding:14px;border-radius:12px;background:#f5f7fb;border:1px solid var(--border);margin-top:12px;line-height:1.6}
.small{font-size:13px;color:var(--muted)}
@media(max-width:720px){.wrap{width:100%;padding:10px}.layout{display:block}.panel{padding:16px}.question-meta{flex-wrap:wrap}#questionText{font-size:19px}.option{padding:13px 11px;gap:9px}.actions button{flex:1;min-width:120px}}
</style>
</head>
<body>
<main class="wrap">
<header class="header"><div class="topline"><div><h1 id="quizTitle">MS Word Practice Test</h1><p class="sub">Free practice quiz · निःशुल्क अभ्यास टेस्ट</p></div><span class="pill" id="countPill">2 Questions</span></div></header>
<div class="layout" id="quizLayout">
<section class="panel">
<div class="question-meta"><span id="questionCounter">Question 1</span><span id="answeredCounter">Answered: 0</span></div>
<h2 id="questionText">Loading questions…</h2><div id="optionsArea"></div>
<div class="actions"><button class="btn-primary" id="nextBtn" type="button">Next →</button><button class="btn-danger" id="submitBtn" type="button" style="display:none">Submit Test</button></div>
</section>
</div>
<section class="panel result" id="resultPanel" aria-live="polite"><p class="score" id="scoreText"></p><p id="resultSummary"></p><div id="reviewArea"></div><div class="actions"><button class="btn-primary" id="restartBtn" type="button">Try Again</button></div></section>
</main>

<script>
// ===================== EDIT THIS SECTION =====================
// 1) Change the title below.
// 2) Add/edit/remove question objects inside QUESTIONS.
// 3) answer must be "A", "B", "C", or "D".
// No separate question file is needed.
const QUIZ_TITLE = "MS Word Practice Test";

const QUESTIONS = [
  // Question 1
  {
    en: "What is MS Word?",
    hi: "MS Word क्या है?",
    options: [
      { en: "A spreadsheet application used for numerical calculations", hi: "एक spreadsheet application जिसका उपयोग numerical calculations के लिए किया जाता है" },
      { en: "A word processing application used to create and edit documents", hi: "एक word processing application जिसका उपयोग documents create और edit करने के लिए किया जाता है" },
      { en: "A database management system used to store records", hi: "एक database management system जिसका उपयोग records store करने के लिए किया जाता है" },
      { en: "A presentation application used to create slides", hi: "एक presentation application जिसका उपयोग slides create करने के लिए किया जाता है" }
    ],
    answer: "B",
    explanation: "MS Word एक word processing application है, जिसका उपयोग documents को create, edit और format करने के लिए किया जाता है।"
  },

  // Question 2
  {
    en: "What is meant by Word Processing?",
    hi: "Word Processing का क्या अर्थ है?",
    options: [
      { en: "The process of creating, editing, formatting, storing, and printing text documents", hi: "Text documents को create, edit, format, store और print करने की प्रक्रिया" },
      { en: "The process of calculating numerical data using formulas", hi: "Formulas का उपयोग करके numerical data calculate करने की प्रक्रिया" },
      { en: "The process of designing computer hardware", hi: "Computer hardware design करने की प्रक्रिया" },
      { en: "The process of creating and managing databases", hi: "Databases create और manage करने की प्रक्रिया" }
    ],
    answer: "A",
    explanation: "Word Processing में text documents को create, edit, format, store और print करना शामिल होता है।"
  }

  // Add Question 3 onward here. Put a comma after the previous question's closing }.
  // Keep every question object inside the QUESTIONS array.
];
// =================== END OF EDIT SECTION =====================

(() => {
  "use strict";
  const letters = ["A","B","C","D"];
  const answers = new Array(QUESTIONS.length).fill(null);
  let current = 0, submitted = false;
  const $ = id => document.getElementById(id);
  document.title = QUIZ_TITLE;
  $("quizTitle").textContent = QUIZ_TITLE;
  $("countPill").textContent = `${QUESTIONS.length} Questions`;
  const normalize = a => typeof a === "number" ? a : letters.indexOf(String(a || "").trim().toUpperCase());
  const bilingual = (en,hi) => `${en || ""}${hi ? "\n" + hi : ""}`;

  function render(){
    if(!QUESTIONS.length){$("questionText").textContent="Please add questions in the QUESTIONS array.";return;}
    const q=QUESTIONS[current];
    $("questionCounter").textContent=`Question ${current+1} of ${QUESTIONS.length}`;
    $("answeredCounter").textContent=`Answered: ${answers.filter(x=>x!==null).length}`;
    $("questionText").textContent=bilingual(q.en,q.hi); $("optionsArea").innerHTML="";
    (q.options||[]).forEach((opt,i)=>{
      const label=document.createElement("label");
      label.className="option"+(answers[current]===i?" selected":"");
      const radio=document.createElement("input");radio.type="radio";radio.name="answer";radio.checked=answers[current]===i;radio.disabled=submitted;
      radio.addEventListener("change",()=>{answers[current]=i;render();});
      const letter=document.createElement("span");letter.className="letter";letter.textContent=letters[i]+".";
      const txt=document.createElement("span");txt.textContent=bilingual(opt.en,opt.hi);
      label.append(radio,letter,txt);
      if(submitted){if(i===normalize(q.answer))label.classList.add("correct");else if(answers[current]===i)label.classList.add("wrong");}
      $("optionsArea").appendChild(label);
    });
    $("nextBtn").style.display = current === QUESTIONS.length - 1 ? "none" : "inline-block";
    $("submitBtn").style.display = current === QUESTIONS.length - 1 ? "inline-block" : "none";
    $("submitBtn").disabled=submitted;renderPalette();
  }
  function submit(){
    if(submitted)return;
    const unanswered=answers.filter(x=>x===null).length;
    if(!confirm(unanswered?`You have ${unanswered} unanswered question(s). Submit anyway?`:"Submit your test now?"))return;
    submitted=true;
    let score=0;QUESTIONS.forEach((q,i)=>{if(answers[i]===normalize(q.answer))score++;});
    $("quizLayout").style.display="none";$("resultPanel").style.display="block";
    $("scoreText").textContent=`${score} / ${QUESTIONS.length}`;
    $("resultSummary").textContent=`Correct: ${score} · Incorrect: ${answers.filter((a,i)=>a!==null&&a!==normalize(QUESTIONS[i].answer)).length} · Unanswered: ${unanswered}`;
    $("reviewArea").innerHTML = `<div class="explanation"><strong>For more practice, visit <a href="https://hpmockshashtra.in" target="_blank" rel="noopener noreferrer">hpmockshashtra.in</a>.</strong><br>अधिक अभ्यास के लिए हमारी वेबसाइट पर जाएँ।</div>`;
    window.scrollTo({top:0,behavior:"smooth"});
  }
  $("nextBtn").addEventListener("click",()=>{if(current<QUESTIONS.length-1){if(answers[current]===null && !confirm("You have not selected an answer. Continue anyway?"))return;current++;render();}});
  $("submitBtn").addEventListener("click",submit);
  $("restartBtn").addEventListener("click",()=>location.reload());
  render();
})();
</script>

<script>
// Basic copy deterrents. These discourage casual copying only; browser-delivered
// questions cannot be made completely uncopyable with client-side code.
document.addEventListener("contextmenu", event => event.preventDefault());
document.addEventListener("copy", event => event.preventDefault());
document.addEventListener("cut", event => event.preventDefault());
document.addEventListener("dragstart", event => event.preventDefault());
document.addEventListener("keydown", event => {
  const key = (event.key || "").toLowerCase();
  if ((event.ctrlKey || event.metaKey) && ["c","x","u","s","p"].includes(key)) {
    event.preventDefault();
  }
});
</script>

</body>
</html>
