<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading | HPMockShashtra</title>

<style>

:root{
  --bg:#050b1d;
  --bg2:#081633;

  --card:#0b1936;
  --card2:#0e2043;

  --blue:#2196ff;
  --blue2:#38bdf8;
  --purple:#6957e8;

  --green:#20d39b;
  --red:#ff6075;
  --yellow:#ffd166;

  --text:#f5f9ff;
  --muted:#91a5c0;

  --border:rgba(74,157,255,.22);
}

/* =========================
   BASIC
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{

  min-height:100vh;

  color:var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:

    radial-gradient(
      circle at 15% 10%,
      rgba(30,120,255,.16),
      transparent 28%
    ),

    radial-gradient(
      circle at 85% 15%,
      rgba(100,75,230,.16),
      transparent 30%
    ),

    linear-gradient(
      135deg,
      #030817,
      #06152f 48%,
      #0a1030
    );

  overflow-x:hidden;
}


/* =========================
   SUBTLE BACKGROUND
========================= */

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  opacity:.13;

  background-image:

    radial-gradient(
      rgba(74,157,255,.45) 1px,
      transparent 1px
    );

  background-size:28px 28px;
}


/* =========================
   MAIN CONTAINER
========================= */

.page{

  width:100%;

  min-height:100vh;

  padding:
    25px 25px 50px;
}


/* =========================
   COURSE TITLE
========================= */

.course-header{

  width:100%;

  margin-bottom:16px;

  padding:
    20px 22px;

  border:
    1px solid
    rgba(74,157,255,.25);

  border-radius:16px;

  background:

    linear-gradient(
      135deg,
      rgba(9,28,60,.96),
      rgba(20,19,61,.94)
    );

  box-shadow:
    0 16px 45px
    rgba(0,0,0,.30);
}


.course-label{

  color:#4dbbff;

  font-size:9px;

  font-weight:900;

  letter-spacing:1px;

  text-transform:uppercase;

  margin-bottom:5px;
}


.course-title{

  margin:0;

  font-size:27px;

  line-height:1.25;

  font-weight:950;

  color:#fff;
}


/* =========================
   LIVE STATS
========================= */

.stats{

  width:100%;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:9px;

  margin-bottom:16px;
}


.stat{

  min-height:70px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  border:
    1px solid
    rgba(74,157,255,.18);

  border-radius:12px;

  background:

    linear-gradient(
      145deg,
      rgba(12,32,67,.95),
      rgba(8,24,52,.95)
    );

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.025);
}


.stat-number{

  font-size:22px;

  line-height:1;

  font-weight:950;
}


.stat-label{

  margin-top:6px;

  color:#8198b5;

  font-size:7px;

  font-weight:850;

  letter-spacing:.5px;

  text-transform:uppercase;
}


.stat.attempted
.stat-number{
  color:#45baff;
}

.stat.correct
.stat-number{
  color:var(--green);
}

.stat.wrong
.stat-number{
  color:var(--red);
}

.stat.unattempted
.stat-number{
  color:var(--yellow);
}


/* =========================
   QUESTION CARD
========================= */

.question-card{

  width:100%;

  padding:
    27px 30px;

  border:
    1px solid
    rgba(74,157,255,.24);

  border-radius:16px;

  background:

    linear-gradient(
      145deg,
      rgba(9,27,57,.98),
      rgba(10,24,52,.98)
    );

  box-shadow:

    0 18px 50px
    rgba(0,0,0,.34);
}


.question-number{

  color:#45baff;

  font-size:9px;

  font-weight:900;

  letter-spacing:.8px;

  text-transform:uppercase;

  margin-bottom:11px;
}


.question{

  margin:0;

  font-size:20px;

  line-height:1.55;

  font-weight:850;

  color:#f7faff;
}


.question-en{

  display:block;
}


.question-hi{

  display:block;

  margin-top:9px;

  color:#c4d7eb;

  font-size:16px;

  line-height:1.55;

  font-weight:650;
}


/* =========================
   OPTIONS
========================= */

.options{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;

  margin-top:23px;
}


.option{

  width:100%;

  min-height:65px;

  display:flex;

  align-items:flex-start;

  padding:
    12px 14px;

  border:
    1px solid
    rgba(74,157,255,.18);

  border-radius:12px;

  background:

    linear-gradient(
      145deg,
      rgba(13,39,79,.94),
      rgba(9,29,60,.96)
    );

  color:#e0ebf8;

  text-align:left;

  font-size:11px;

  font-weight:700;

  line-height:1.5;

  cursor:pointer;

  transition:
    .18s ease;
}


.option:hover:not(:disabled){

  border-color:
    rgba(54,175,255,.65);

  background:

    linear-gradient(
      120deg,
      rgba(20,117,225,.23),
      rgba(100,78,220,.18)
    );

  transform:
    translateY(-1px);

  box-shadow:
    0 7px 20px
    rgba(23,130,255,.08);
}


.option:disabled{
  cursor:default;
}


.option-letter{

  width:29px;

  height:29px;

  flex:
    0 0 29px;

  display:grid;

  place-items:center;

  margin-right:9px;

  border-radius:8px;

  background:
    rgba(40,135,230,.12);

  border:
    1px solid
    rgba(69,166,255,.20);

  color:#72c8ff;

  font-size:9px;

  font-weight:950;
}


.option-content{
  flex:1;
}


.option-en{
  display:block;
}


.option-hi{

  display:block;

  margin-top:4px;

  color:#9fb5cf;

  font-size:9px;

  font-weight:600;
}


/* =========================
   CORRECT
========================= */

.option.correct{

  border-color:
    rgba(32,211,155,.75)
    !important;

  background:
    rgba(32,211,155,.13)
    !important;

  color:#e4fff5;
}


.option.correct .option-letter{

  background:
    rgba(32,211,155,.20);

  color:#4de3b0;

  border-color:
    rgba(32,211,155,.38);
}


/* =========================
   WRONG
========================= */

.option.wrong{

  border-color:
    rgba(255,96,117,.78)
    !important;

  background:
    rgba(255,96,117,.13)
    !important;

  color:#ffe5e9;
}


.option.wrong .option-letter{

  background:
    rgba(255,96,117,.20);

  color:#ff8798;

  border-color:
    rgba(255,96,117,.38);
}


/* =========================
   CORRECT ANSWER REVEAL
========================= */

.option.correct-answer{

  border-color:
    rgba(32,211,155,.52)
    !important;

  background:
    rgba(32,211,155,.075)
    !important;
}


/* =========================
   ANSWER STATUS
========================= */

.answer-status{

  display:none;

  margin-top:17px;

  padding:
    12px 14px;

  border-radius:10px;

  font-size:10px;

  font-weight:850;

  line-height:1.5;
}


.answer-status.show{
  display:block;
}


.answer-status.correct{

  color:#54e5b3;

  background:
    rgba(32,211,155,.08);

  border:
    1px solid
    rgba(32,211,155,.20);
}


.answer-status.wrong{

  color:#ff7b8d;

  background:
    rgba(255,96,117,.08);

  border:
    1px solid
    rgba(255,96,117,.20);
}


/* =========================
   NEXT BUTTON
========================= */

.action-area{

  display:flex;

  justify-content:flex-end;

  margin-top:18px;
}


.next-btn{

  border:0;

  border-radius:10px;

  padding:
    11px 21px;

  color:#fff;

  background:

    linear-gradient(
      100deg,
      #168eff,
      #5968f4,
      #8055f4
    );

  box-shadow:
    0 7px 22px
    rgba(37,99,235,.22);

  font-size:10px;

  font-weight:900;

  cursor:pointer;

  transition:.18s ease;
}


.next-btn:hover:not(:disabled){

  transform:
    translateY(-1px);

  box-shadow:
    0 10px 28px
    rgba(37,99,235,.32);
}


.next-btn:disabled{

  opacity:.38;

  cursor:not-allowed;
}


/* =========================
   LOADING
========================= */

.loading{

  min-height:80vh;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#7fcaff;

  font-size:11px;
}


/* =========================
   COMPLETED
========================= */

.completed{

  display:none;

  width:100%;

  padding:
    35px 25px;

  text-align:center;

  border:
    1px solid
    rgba(74,157,255,.24);

  border-radius:16px;

  background:

    linear-gradient(
      145deg,
      rgba(9,28,60,.97),
      rgba(20,19,61,.95)
    );
}


.completed-title{

  font-size:24px;

  font-weight:950;
}


.completed-sub{

  margin-top:7px;

  color:#91a6c0;

  font-size:9px;
}


.review-btn{

  display:inline-block;

  margin-top:20px;

  padding:
    11px 22px;

  border-radius:10px;

  color:#fff;

  background:

    linear-gradient(
      100deg,
      #168eff,
      #5968f4,
      #8055f4
    );

  text-decoration:none;

  font-size:10px;

  font-weight:900;
}


/* =========================
   ACCESS DENIED
========================= */

.access-box{

  display:none;

  width:100%;

  padding:
    45px 20px;

  text-align:center;

  border:
    1px solid
    rgba(255,96,117,.25);

  border-radius:16px;

  background:
    rgba(255,96,117,.055);
}


.access-box h2{

  margin:0;

  font-size:19px;
}


.access-box p{

  color:#9fb2ca;

  font-size:10px;

  line-height:1.6;
}


.buy-btn{

  display:inline-block;

  margin-top:8px;

  padding:
    11px 21px;

  border-radius:10px;

  color:#fff;

  background:

    linear-gradient(
      100deg,
      #168eff,
      #5968f4,
      #8055f4
    );

  text-decoration:none;

  font-size:10px;

  font-weight:900;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

  .page{

    padding:
      12px 8px 35px;
  }


  .course-header{

    padding:
      17px 15px;
  }


  .course-title{

    font-size:21px;
  }


  .stats{

    grid-template-columns:
      repeat(4,1fr);

    gap:5px;
  }


  .stat{

    min-height:62px;

    padding:
      7px 3px;
  }


  .stat-number{

    font-size:16px;
  }


  .stat-label{

    font-size:5.5px;
  }


  .question-card{

    padding:
      20px 15px;
  }


  .question{

    font-size:17px;
  }


  .question-hi{

    font-size:14px;
  }


  .options{

    grid-template-columns:1fr;

    gap:9px;
  }


  .option{

    min-height:58px;

    font-size:10px;
  }


  .option-hi{

    font-size:8.5px;
  }


  .action-area{

    justify-content:stretch;
  }


  .next-btn{

    width:100%;
  }

}


@media(max-width:400px){

  .course-title{

    font-size:19px;
  }


  .stat-number{

    font-size:14px;
  }


  .stat-label{

    font-size:5px;
  }

}

</style>

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  auth,
  db
} from "../firebase-config.js";


import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =====================================================
   HELPER
===================================================== */

const $ =
  id => document.getElementById(id);


/* =====================================================
   FILE / COURSE DETECTION
===================================================== */

const fileName =
  location.pathname
    .split("/")
    .pop()
    .replace(/\.html$/i,"");


/*
  Example:

  paid-computer-fundamentals
  →
  computer-fundamentals
*/

const COURSE_ID =
  fileName
    .replace(/^paid-/i,"")
    .toLowerCase();


/*
  computer-fundamentals
  →
  computer_fundamentals_01
*/

const TEST_ID =
  COURSE_ID
    .replace(/-/g,"_")
    + "_01";


/* =====================================================
   COURSE TITLES
===================================================== */

const COURSE_TITLES = {

  "computer-fundamentals":
    "Computer Fundamentals",

  "ms-word":
    "MS Word",

  "ms-excel":
    "MS Excel",

  "ms-powerpoint":
    "MS PowerPoint",

  "ms-access":
    "MS Access",

  "dbms-sql":
    "DBMS & SQL",

  "computer-networking":
    "Computer Networking",

  "cyber-security":
    "Cyber Security",

  "c-programming":
    "C Programming",

  "html":
    "HTML",

  "css-css3":
    "CSS & CSS3",

  "cloud-computing":
    "Cloud Computing",

  "data-structure":
    "Data Structure",

  "computer-organisation":
    "Computer Organisation",

  "operating-system":
    "Operating System"

};


const COURSE_TITLE =
  COURSE_TITLES[COURSE_ID]
  ||
  COURSE_ID
    .split("-")
    .map(
      word =>
        word.charAt(0).toUpperCase()
        +
        word.slice(1)
    )
    .join(" ");


/* =====================================================
   PAGE TITLE
===================================================== */

document.title =
  `${COURSE_TITLE} | HPMockShashtra`;

$("courseTitle").textContent =
  COURSE_TITLE;

$("buyBtn").href =
  `../payment.html?product=${encodeURIComponent(COURSE_ID)}`;

$("reviewBtn").href =
  `mahapack-study.html?test=${TEST_ID}`;


/* =====================================================
   QUESTION BANK
===================================================== */

/*
  IMPORTANT:

  This page is inside /mahapack/

  Therefore:

  paid-computer-fundamentals.html
  loads:

  ./computer-fundamentals.js

  NOT:

  ./mahapack/computer-fundamentals.js
*/

let QUESTIONS = [];


try{

  const module =
    await import(
      `./${COURSE_ID}.js`
    );


  QUESTIONS =
    Array.isArray(module.QUESTIONS)
      ? module.QUESTIONS
      : [];


  if(
    QUESTIONS.length === 0
  ){

    throw new Error(
      `No QUESTIONS found in ${COURSE_ID}.js`
    );

  }

}
catch(error){

  console.error(
    "QUESTION BANK ERROR:",
    error
  );


  $("loading").textContent =
    `Question bank load नहीं हो सका: ${COURSE_ID}.js`;

  throw error;

}


/* =====================================================
   FIRESTORE REFERENCES
===================================================== */

let currentUser = null;

let sessionRef = null;

let attemptRef = null;


/* =====================================================
   STATE
===================================================== */

let state = {

  current:0,

  answers:{},

  submitted:false

};


/* =====================================================
   OFFICE COURSES
===================================================== */

const OFFICE_COURSES = [

  "ms-word",
  "ms-excel",
  "ms-powerpoint",
  "ms-access"

];


/* =====================================================
   DATE HELPER
===================================================== */

function toDate(value){

  if(!value){
    return null;
  }


  if(
    typeof value.toDate === "function"
  ){

    return value.toDate();

  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return null;

  }


  return date;

}


/* =====================================================
   ACTIVE ACCESS
===================================================== */

function activeAccess(access){

  if(!access){
    return false;
  }


  const expiresAt =
    toDate(
      access.expiresAt
    );


  const purchasedAt =
    toDate(
      access.purchasedAt
    );


  if(
    !expiresAt
    ||
    expiresAt.getTime()
      <= Date.now()
  ){

    return false;

  }


  if(
    purchasedAt
    &&
    purchasedAt.getTime()
      > Date.now()
  ){

    return false;

  }


  return true;

}


/* =====================================================
   COURSE ACCESS
===================================================== */

function hasCourseAccess(data){


  /* =========================
     INDIVIDUAL COURSE
  ========================= */

  const individual =
    data
      ?.mahapackAccess
      ?.courses
      ?.[COURSE_ID];


  if(
    activeAccess(individual)
  ){

    return true;

  }


  /* =========================
     MS OFFICE PACK
  ========================= */

  if(
    OFFICE_COURSES
      .includes(COURSE_ID)
  ){

    const office =
      data
        ?.mahapackAccess
        ?.packs
        ?.["ms-office"];


    if(
      activeAccess(office)
    ){

      return true;

    }

  }


  /* =========================
     COMPUTER MASTER
  ========================= */

  const master =
    data
      ?.mahapackAccess
      ?.packs
      ?.["computer-master"];


  if(
    activeAccess(master)
  ){

    return true;

  }


  /* =========================
     LEGACY FALLBACK
  ========================= */

  const oldIndividual =
    data
      ?.computerAccess
      ?.courses
      ?.[COURSE_ID];


  if(
    activeAccess(oldIndividual)
  ){

    return true;

  }


  if(
    OFFICE_COURSES
      .includes(COURSE_ID)
  ){

    const oldOffice =
      data
        ?.computerAccess
        ?.packs
        ?.["ms-office"];


    if(
      activeAccess(oldOffice)
    ){

      return true;

    }

  }


  const oldMaster =
    data
      ?.computerAccess
      ?.packs
      ?.["computer-master"];


  if(
    activeAccess(oldMaster)
  ){

    return true;

  }


  return false;

}


/* =====================================================
   NORMALIZE ANSWERS
===================================================== */

function normalizeAnswers(data){

  const result = {};


  if(
    !data
    ||
    typeof data !== "object"
  ){

    return result;

  }


  Object.keys(data)
    .forEach(key => {

      const value =
        Number(data[key]);


      if(
        Number.isInteger(value)
      ){

        result[key] =
          value;

      }

    });


  return result;

}


/* =====================================================
   ANSWER INDEX
===================================================== */

function answerIndex(answer){

  if(
    typeof answer === "number"
  ){

    return answer;

  }


  if(
    typeof answer === "string"
  ){

    const value =
      answer
        .trim()
        .toUpperCase();


    if(
      ["A","B","C","D"]
        .includes(value)
    ){

      return (
        value.charCodeAt(0)
        - 65
      );

    }


    const number =
      Number(value);


    if(
      Number.isInteger(number)
    ){

      return number;

    }

  }


  return -1;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    character => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[character])
  );

}


/* =====================================================
   OPTION TEXT
===================================================== */

function optionText(
  option,
  language
){

  if(
    option
    &&
    typeof option === "object"
  ){

    return (
      option[language]
      ??
      option.en
      ??
      option.hi
      ??
      ""
    );

  }


  return option ?? "";

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

  const attempted =
    Object.keys(
      state.answers
    ).length;


  let correct = 0;


  Object.keys(
    state.answers
  )
  .forEach(key => {

    const questionIndex =
      Number(key);


    if(
      QUESTIONS[questionIndex]
      &&
      answerIndex(
        QUESTIONS[questionIndex].answer
      )
      ===
      Number(
        state.answers[key]
      )
    ){

      correct++;

    }

  });


  const wrong =
    attempted - correct;


  const unattempted =
    QUESTIONS.length - attempted;


  $("attemptedCount")
    .textContent =
    attempted;


  $("correctCount")
    .textContent =
    correct;


  $("wrongCount")
    .textContent =
    wrong;


  $("unattemptedCount")
    .textContent =
    unattempted;

}


/* =====================================================
   SAVE SESSION
===================================================== */

async function saveSession(){

  if(!sessionRef){
    return false;
  }


  try{

    await setDoc(
      sessionRef,
      {

        uid:
          currentUser.uid,

        testId:
          TEST_ID,

        current:
          state.current,

        answers:
          state.answers,

        status:
          "in_progress",

        questionCount:
          QUESTIONS.length,

        updatedAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );


    return true;

  }
  catch(error){

    console.error(
      "SESSION SAVE ERROR:",
      error
    );

    return false;

  }

}


/* =====================================================
   LOAD SESSION
===================================================== */

async function loadSession(){

  const snap =
    await getDoc(
      sessionRef
    );


  if(
    snap.exists()
  ){

    const data =
      snap.data();


    state.current =
      Math.max(
        0,
        Math.min(
          Number(data.current) || 0,
          QUESTIONS.length - 1
        )
      );


    state.answers =
      normalizeAnswers(
        data.answers
      );


  }
  else{

    state = {

      current:0,

      answers:{},

      submitted:false

    };


    await saveSession();

  }

}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion(){

  if(
    state.submitted
  ){

    showCompleted();

    return;

  }


  const question =
    QUESTIONS[
      state.current
    ];


  if(!question){

    return;

  }


  const selected =
    state.answers[
      state.current
    ];


  const hasAnswer =
    selected !== undefined;


  const correct =
    answerIndex(
      question.answer
    );


  /* =========================
     QUESTION NUMBER
  ========================= */

  $("questionNumber")
    .textContent =
    `Question ${state.current + 1} of ${QUESTIONS.length}`;


  /* =========================
     QUESTION TEXT
  ========================= */

  $("questionText")
    .innerHTML =

    `
      <span class="question-en">
        ${escapeHTML(
          question.en || ""
        )}
      </span>

      ${
        question.hi
        ?
        `
          <span class="question-hi">
            ${escapeHTML(
              question.hi
            )}
          </span>
        `
        :
        ""
      }
    `;


  /* =========================
     OPTIONS
  ========================= */

  const options =
    $("options");


  options.innerHTML =
    "";


  question.options
    .forEach(
      (option,index) => {

        const button =
          document.createElement(
            "button"
          );


        button.type =
          "button";


        button.className =
          "option";


        const english =
          optionText(
            option,
            "en"
          );


        const hindi =
          optionText(
            option,
            "hi"
          );


        button.innerHTML =

          `
            <span class="option-letter">
              ${String.fromCharCode(
                65 + index
              )}
            </span>

            <span class="option-content">

              <span class="option-en">
                ${escapeHTML(
                  english
                )}
              </span>

              ${
                hindi
                ?
                `
                  <span class="option-hi">
                    ${escapeHTML(
                      hindi
                    )}
                  </span>
                `
                :
                ""
              }

            </span>
          `;


        /* =========================
           ALREADY ANSWERED
        ========================= */

        if(
          hasAnswer
        ){

          button.disabled =
            true;


          /* Correct option */

          if(
            index === correct
          ){

            button.classList.add(
              "correct-answer"
            );

          }


          /* User selected correct */

          if(
            index === selected
            &&
            selected === correct
          ){

            button.classList.add(
              "correct"
            );

          }


          /* User selected wrong */

          if(
            index === selected
            &&
            selected !== correct
          ){

            button.classList.add(
              "wrong"
            );

          }

        }
        else{

          button.onclick =
            () => selectAnswer(index);

        }


        options.appendChild(
          button
        );

      }
    );


  /* =========================
     ANSWER STATUS
  ========================= */

  const status =
    $("answerStatus");


  if(
    hasAnswer
  ){

    const isCorrect =
      selected === correct;


    status.className =
      `answer-status show ${
        isCorrect
          ? "correct"
          : "wrong"
      }`;


    if(
      isCorrect
    ){

      status.textContent =
        "✓ Correct Answer";

    }
    else{

      status.textContent =
        `✕ Wrong Answer — Correct Answer: ${String.fromCharCode(
          65 + correct
        )}`;

    }

  }
  else{

    status.className =
      "answer-status";

    status.textContent =
      "";

  }


  /* =========================
     NEXT BUTTON
  ========================= */

  $("nextBtn").disabled =
    !hasAnswer;


  $("nextBtn").textContent =

    state.current ===
    QUESTIONS.length - 1

      ? "Finish Practice →"

      : "Next Question →";


  /* =========================
     STATS
  ========================= */

  updateStats();

}


/* =====================================================
   SELECT ANSWER
===================================================== */

async function selectAnswer(index){

  if(
    state.answers[
      state.current
    ] !== undefined
  ){

    return;

  }


  state.answers[
    state.current
  ] = index;


  /*
    Immediately show
    correct / wrong.
  */

  renderQuestion();


  /*
    Immediately save
    answer to Firebase.
  */

  await saveSession();

}


/* =====================================================
   NEXT QUESTION
===================================================== */

async function nextQuestion(){

  if(
    state.answers[
      state.current
    ] === undefined
  ){

    return;

  }


  /* =========================
     MORE QUESTIONS
  ========================= */

  if(
    state.current
    <
    QUESTIONS.length - 1
  ){

    state.current++;


    await saveSession();


    renderQuestion();


    window.scrollTo({

      top:0,

      behavior:"smooth"

    });


    return;

  }


  /* =========================
     FINAL QUESTION
  ========================= */

  await completeAttempt();

}


/* =====================================================
   COMPLETE ATTEMPT
===================================================== */

async function completeAttempt(){

  const attempted =
    Object.keys(
      state.answers
    ).length;


  let correct = 0;


  Object.keys(
    state.answers
  )
  .forEach(key => {

    const index =
      Number(key);


    if(
      QUESTIONS[index]
      &&
      answerIndex(
        QUESTIONS[index].answer
      )
      ===
      Number(
        state.answers[key]
      )
    ){

      correct++;

    }

  });


  const wrong =
    attempted - correct;


  const unattempted =
    QUESTIONS.length - attempted;


  try{

    /*
      FINAL RESULT
    */

    await setDoc(
      attemptRef,
      {

        uid:
          currentUser.uid,

        testId:
          TEST_ID,

        questionCount:
          QUESTIONS.length,

        attempted:
          attempted,

        correct:
          correct,

        wrong:
          wrong,

        unattempted:
          unattempted,

        answers:
          state.answers,

        status:
          "completed",

        completedAt:
          serverTimestamp()

      }
    );


    /*
      Mark session completed
    */

    await setDoc(
      sessionRef,
      {

        status:
          "completed",

        completedAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );


    state.submitted =
      true;


    showCompleted();

  }
  catch(error){

    console.error(
      "FINAL ATTEMPT ERROR:",
      error
    );


    alert(
      "Attempt save नहीं हो पाया। कृपया फिर से कोशिश करें।"
    );

  }

}


/* =====================================================
   COMPLETED
===================================================== */

function showCompleted(){

  $("questionCard")
    .style.display =
    "none";


  $("completed")
    .style.display =
    "block";


  updateStats();

}


/* =====================================================
   NEXT BUTTON
===================================================== */

$("nextBtn").onclick =
  nextQuestion;


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    /* =========================
       NOT LOGGED IN
    ========================= */

    if(!user){

      const redirect =
        encodeURIComponent(
          location.pathname
            .split("/")
            .pop()
        );


      location.href =
        `../firebase-login.html?redirect=${redirect}`;


      return;

    }


    currentUser =
      user;


    try{

      /* =========================
         CHECK ACCESS
      ========================= */

      const accessSnap =
        await getDoc(
          doc(
            db,
            "testAccess",
            user.uid
          )
        );


      const accessData =
        accessSnap.exists()
          ? accessSnap.data()
          : {};


      if(
        !hasCourseAccess(
          accessData
        )
      ){

        $("loading")
          .style.display =
          "none";


        $("accessBox")
          .style.display =
          "block";


        $("accessMessage")
          .textContent =
          `${COURSE_TITLE} access is not active. Please purchase this course.`;


        return;

      }


      /* =========================
         FIRESTORE REFERENCES
      ========================= */

      sessionRef =
        doc(
          db,
          "users",
          user.uid,
          "mahapackSessions",
          TEST_ID
        );


      attemptRef =
        doc(
          db,
          "users",
          user.uid,
          "mahapackAttempts",
          TEST_ID
        );


      /* =========================
         CHECK COMPLETED ATTEMPT
      ========================= */

      const finalSnap =
        await getDoc(
          attemptRef
        );


      if(
        finalSnap.exists()
      ){

        const finalData =
          finalSnap.data();


        state.answers =
          normalizeAnswers(
            finalData.answers
          );


        state.submitted =
          true;

      }
      else{

        await loadSession();

      }


      /* =========================
         SHOW PAGE
      ========================= */

      $("loading")
        .style.display =
        "none";


      $("practice")
        .style.display =
        "block";


      updateStats();


      /* =========================
         COMPLETED
      ========================= */

      if(
        state.submitted
      ){

        showCompleted();

        return;

      }


      /* =========================
         SHOW QUESTION
      ========================= */

      renderQuestion();


    }
    catch(error){

      console.error(
        "INITIALIZATION ERROR:",
        error
      );


      $("loading")
        .textContent =
        "Practice load नहीं हो सकी। Please refresh the page.";

    }

  });


</script>
