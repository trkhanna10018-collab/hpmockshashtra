<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOA IT Mock Test — Study Mode | HPMockShashtra</title>

<style>
*{
  box-sizing:border-box;
  font-family:"Segoe UI",Arial,sans-serif;
}

body{
  margin:0;
  background:#eef4fb;
  color:#172033;
}

.header{
  height:70px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:#1f2937;
  font-weight:800;
  font-size:20px;
}

.brand img{
  width:50px;
  height:50px;
  object-fit:contain;
  border-radius:8px;
}

.back{
  padding:9px 13px;
  border-radius:8px;
  background:#f3f4f6;
  color:#374151;
  text-decoration:none;
  font-weight:600;
  font-size:13px;
}

.wrap{
  max-width:900px;
  margin:26px auto;
  padding:0 16px 50px;
}

.top{
  background:linear-gradient(135deg,#4338ca,#6366f1);
  color:#fff;
  border-radius:16px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(67,56,202,.16);
}

.top h1{
  margin:0 0 7px;
  font-size:25px;
}

.top p{
  margin:0 0 15px;
  opacity:.92;
}

.meta{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.pill{
  background:rgba(255,255,255,.14);
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:22px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.counter{
  font-weight:800;
  color:#4f46e5;
  margin-bottom:18px;
}

.question{
  font-size:19px;
  font-weight:700;
  line-height:1.55;
  margin-bottom:7px;
}

.hindi{
  font-size:17px;
  line-height:1.55;
  color:#374151;
  margin-bottom:20px;
}

.options{
  display:grid;
  gap:10px;
}

.option{
  display:flex;
  gap:10px;
  align-items:flex-start;
  border:1px solid #dbe2ea;
  border-radius:10px;
  padding:13px;
  line-height:1.5;
  background:#fff;
}

.option.selected-wrong{
  border-color:#f97316;
  background:#fff7ed;
}

.option.correct{
  border-color:#16a34a;
  background:#dcfce7;
}

.option.correct.selected{
  border-color:#16a34a;
  background:#dcfce7;
}

.option input{
  margin-top:4px;
}

.status{
  margin-top:18px;
  padding:11px 14px;
  border-radius:9px;
  font-weight:800;
}

.status.correct{
  color:#166534;
  background:#dcfce7;
}

.status.incorrect{
  color:#b91c1c;
  background:#fee2e2;
}

.explanation{
  margin-top:12px;
  padding:12px 14px;
  border-left:4px solid #6366f1;
  background:#f8fafc;
  color:#374151;
  line-height:1.55;
}

.controls{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:22px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 17px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}

.primary{
  background:#4f46e5;
  color:#fff;
}

.secondary{
  background:#f3f4f6;
  color:#374151;
}

.primary:disabled,
.secondary:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.error{
  text-align:center;
  color:#b91c1c;
}

.score{
  text-align:center;
  margin-bottom:18px;
}

.score-number{
  font-size:42px;
  font-weight:900;
  color:#4f46e5;
}

.score p{
  margin:4px 0;
  color:#6b7280;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){
  .header{
    padding:0 14px;
  }

  .brand{
    font-size:17px;
  }

  .brand img{
    width:43px;
    height:43px;
  }

  .top h1{
    font-size:21px;
  }

  .card{
    padding:16px;
  }

  .question{
    font-size:17px;
  }

  .hindi{
    font-size:16px;
  }

  .controls{
    flex-direction:column;
  }

  .btn{
    width:100%;
    text-align:center;
  }
}
</style>
</head>

<body>

<header class="header">
  <a class="brand" href="firebase-dashboard.html">
    <img src="logo.png" alt="HPMockShashtra">
    <span>HP<span style="color:#4f46e5">Mock</span>Shashtra</span>
  </a>

  <a class="back" href="joa-series.html">← Test Series</a>
</header>

<div class="wrap">

  <div class="top">
    <h1 id="pageTitle">JOA IT Mock Test — Study Mode</h1>
    <p>Read-only review of your attempted test</p>

    <div class="meta">
      <span class="pill">100 Questions</span>
      <span class="pill">Hindi + English</span>
      <span class="pill">Study Mode</span>
    </div>
  </div>

  <div id="loading" class="card">
    Loading your attempted test...
  </div>

  <div id="reviewArea" class="hidden">

    <div class="card score">
      <div class="score-number" id="score"></div>
      <p id="percentage"></p>
      <p>Read-only review — answers cannot be changed.</p>
    </div>

    <div class="card">
      <div class="counter" id="counter"></div>

      <div class="question" id="questionEn"></div>
      <div class="hindi" id="questionHi"></div>

      <div class="options" id="options"></div>

      <div id="status" class="status hidden"></div>

      <div id="explanation" class="explanation hidden"></div>

      <div class="controls">
        <button class="btn secondary" id="prevBtn">Previous</button>
        <button class="btn primary" id="nextBtn">Next</button>
      </div>
    </div>

  </div>

  <div id="errorArea" class="card error hidden"></div>

</div>

<script type="module">

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";

const TEST_ID = new URLSearchParams(window.location.search).get("test")
  || "joa_free_test_01";

const TEST_CONFIG = {
  joa_free_test_01: {
    name: "JOA IT Free Mock Test",
    testPage: "joa-free-test.html",
    questionBank: "./joa-question-bank.js"
  },
  joa_test_01: {
    name: "JOA IT Mock Test 01",
    testPage: "joa-test-01.html",
    questionBank: "./joa-test-01.js"
  },
  joa_test_02: {
    name: "JOA IT Mock Test 02",
    testPage: "joa-test-02.html",
    questionBank: "./joa-test-02.js"
  },
  joa_test_03: {
    name: "JOA IT Mock Test 03",
    testPage: "joa-test-03.html",
    questionBank: "./joa-test-03.js"
  },
  joa_test_04: {
    name: "JOA IT Mock Test 04",
    testPage: "joa-test-04.html",
    questionBank: "./joa-test-04.js"
  },
  joa_test_05: {
    name: "JOA IT Mock Test 05",
    testPage: "joa-test-05.html",
    questionBank: "./joa-test-05.js"
  },
  joa_test_06: {
    name: "JOA IT Mock Test 06",
    testPage: "joa-test-06.html",
    questionBank: "./joa-test-06.js"
  },
  joa_test_07: {
    name: "JOA IT Mock Test 07",
    testPage: "joa-test-07.html",
    questionBank: "./joa-test-07.js"
  },
  joa_test_08: {
    name: "JOA IT Mock Test 08",
    testPage: "joa-test-08.html",
    questionBank: "./joa-test-08.js"
  },
  joa_test_09: {
    name: "JOA IT Mock Test 09",
    testPage: "joa-test-09.html",
    questionBank: "./joa-test-09.js"
  },
  joa_test_10: {
    name: "JOA IT Mock Test 10",
    testPage: "joa-test-10.html",
    questionBank: "./joa-test-10.js"
  },
  joa_test_11: {
    name: "JOA IT Mock Test 11",
    testPage: "joa-test-11.html",
    questionBank: "./joa-test-11.js"
  },
  joa_test_12: {
    name: "JOA IT Mock Test 12",
    testPage: "joa-test-12.html",
    questionBank: "./joa-test-12.js"
  },
  joa_test_13: {
    name: "JOA IT Mock Test 13",
    testPage: "joa-test-13.html",
    questionBank: "./joa-test-13.js"
  },
  joa_test_14: {
    name: "JOA IT Mock Test 14",
    testPage: "joa-test-14.html",
    questionBank: "./joa-test-14.js"
  },
  joa_test_15: {
    name: "JOA IT Mock Test 15",
    testPage: "joa-test-15.html",
    questionBank: "./joa-test-15.js"
  }
};

const config = TEST_CONFIG[TEST_ID];

if (!config) {
  throw new Error("Invalid test ID.");
}

const { questions } = await import(config.questionBank);
const ATTEMPT_ID_SUFFIX = "_" + TEST_ID;

const $ = id => document.getElementById(id);

let user = null;
let attempt = null;
let answers = {};
let current = 0;

$("pageTitle").textContent = `${config.name} — Study Mode`;

onAuthStateChanged(auth, async (u) => {

  if(!u){
    location.href = "firebase-login.html";
    return;
  }

  user = u;

  try{

    const attemptRef = doc(
      db,
      "testAttempts",
      user.uid + ATTEMPT_ID_SUFFIX
    );

    const snap = await getDoc(attemptRef);

    if(!snap.exists()){
      $("loading").classList.add("hidden");

      $("errorArea").classList.remove("hidden");
      $("errorArea").innerHTML = `
        <h2>No Attempt Found</h2>
        <p id="noAttemptText">You have not completed this mock test yet.</p>
        <br>
        <a class="btn primary" id="goToTest" href="${config.testPage}">Go to Test</a>
        <a class="btn secondary" href="joa-series.html">Back to Series</a>
      `;

      return;
    }

    attempt = snap.data();

    if(attempt.testId !== TEST_ID){
      throw new Error("Invalid test record for this Study Mode.");
    }

    answers = attempt.answers || {};
    current = 0;

    $("score").textContent =
      `${attempt.score ?? 0}/${attempt.total ?? questions.length}`;

    $("percentage").textContent =
      `Percentage: ${attempt.percentage ?? 0}%`;

    $("loading").classList.add("hidden");
    $("reviewArea").classList.remove("hidden");

    render();

  }catch(e){

    console.error(e);

    $("loading").classList.add("hidden");
    $("errorArea").classList.remove("hidden");

    $("errorArea").innerHTML = `
      <h2>Unable to Load Study Mode</h2>
      <p>Please refresh the page and try again.</p>
      <br>
      <a class="btn secondary" href="joa-series.html">Back to Series</a>
    `;
  }

});


function render(){

  if(!questions.length){
    $("errorArea").classList.remove("hidden");
    $("errorArea").innerHTML = "<h2>Question bank is empty.</h2>";
    return;
  }

  const q = questions[current];

  const selected = answers[current];
  const correct = q.ans;

  $("counter").textContent =
    `Question ${current + 1} of ${questions.length}`;

  $("questionEn").textContent =
    q.en || "[English question not available]";

  $("questionHi").textContent =
    q.hi || "[Hindi question not available]";

  $("options").innerHTML =
    ["A","B","C","D"].map(k => {

      const isCorrect = correct === k;
      const isSelected = selected === k;

      let className = "option";

      /*
        Correct answer is ALWAYS green.
        Wrong selected answer is orange/red.
        If selected answer is also correct, green wins.
      */
      if(isCorrect){
        className += " correct";
        if(isSelected) className += " selected";
      }else if(isSelected){
        className += " selected-wrong";
      }

      return `
        <div class="${className}">
          <input
            type="radio"
            disabled
            ${isSelected ? "checked" : ""}
          >

          <span>
            <strong>${k}.</strong> ${q[k] || "[Option not available]"}
          </span>
        </div>
      `;

    }).join("");


  const status = $("status");

  status.classList.remove("hidden");
  status.classList.remove("correct","incorrect");

  if(selected && selected === correct){

    status.classList.add("correct");
    status.textContent = "✓ Correct";

  }else{

    status.classList.add("incorrect");
    status.textContent = "✗ Incorrect";

  }


  const explanation = $("explanation");

  if(q.explanation){

    explanation.classList.remove("hidden");
    explanation.innerHTML =
      `<strong>Explanation:</strong> ${q.explanation}`;

  }else{

    explanation.classList.add("hidden");
    explanation.textContent = "";

  }


  $("prevBtn").disabled = current === 0;

  $("nextBtn").textContent =
    current === questions.length - 1
      ? "Back to Series"
      : "Next";

}


$("prevBtn").onclick = () => {

  if(current > 0){

    current--;
    render();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

};


$("nextBtn").onclick = () => {

  if(current < questions.length - 1){

    current++;
    render();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }else{

    location.href = "joa-series.html";

  }

};

</script>

</body>
</html>
