<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Study Mode | HPMockShashtra</title>
<style>
*{box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}
body{margin:0;background:#eef4fb;color:#172033}
.header{height:70px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#1f2937;font-weight:800;font-size:20px}
.brand img{width:50px;height:50px;object-fit:contain}
.back{padding:9px 13px;border-radius:8px;background:#f3f4f6;color:#374151;text-decoration:none;font-weight:600;font-size:13px}

.wrap{max-width:900px;margin:28px auto;padding:0 16px 45px}
.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.head{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #e5e7eb;padding-bottom:14px;margin-bottom:18px}
.badge{background:#eef2ff;color:#4338ca;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.q{font-size:19px;font-weight:700;line-height:1.5}
.hi{font-size:17px;color:#374151;line-height:1.5;margin-top:6px}

.options{margin-top:18px;display:grid;gap:9px}
.option{position:relative;padding:13px 14px;border:1px solid #dbe1ea;border-radius:9px;background:#fff;line-height:1.45;transition:.15s}
.option.selected{border:2px solid #ef4444;background:#fff5f5;padding:12px 13px}
.option.correct-option{border:2px solid #22c55e;background:#f0fdf4;padding:12px 13px}
.option.selected.correct-option{border:2px solid #22c55e;background:#ecfdf5}
.option-letter{font-weight:800;margin-right:7px}
.option-state{float:right;font-size:10px;font-weight:800;letter-spacing:.2px}
.selected-state{color:#dc2626}
.correct-state{color:#15803d}

.result-box{margin-top:15px;padding:11px 14px;border-radius:9px;font-weight:800;text-align:center;border:1px solid #e5e7eb;background:#f8fafc}
.result-box.correct{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.result-box.wrong{background:#fef2f2;border-color:#fecaca;color:#b91c1c}

.explanation{margin-top:12px;padding:11px 14px;border-radius:9px;background:#f8fafc;border:1px solid #e5e7eb;font-size:13px;line-height:1.5}
.explanation .label{font-size:10px;color:#6b7280;font-weight:800;text-transform:uppercase;margin-bottom:4px}

.controls{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{border:0;border-radius:9px;padding:10px 17px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:#4f46e5;color:#fff}.secondary{background:#f3f4f6;color:#374151}
button:disabled{opacity:.5;cursor:not-allowed}
.loading{text-align:center;padding:40px}

@media(max-width:600px){
 .header{padding:0 14px}.brand{font-size:17px}.brand img{width:43px;height:43px}
 .wrap{margin:18px auto;padding:0 12px 35px}.card{padding:17px}
 .head{align-items:flex-start;flex-direction:column}.q{font-size:17px}.hi{font-size:15px}
 .option{font-size:14px;padding:12px}.option.selected,.option.correct-option,.option.selected.correct-option{padding:11px}
 .controls{flex-direction:column}.btn{width:100%;text-align:center}
}
</style>
</head>
<body>
<header class="header"><a class="brand" href="firebase-dashboard.html"><img src="logo.png" alt="HPMockShashtra"><span>HP<span style="color:#4f46e5">Mock</span>Shashtra</span></a><a class="back" href="joa-series.html">← Test Series</a></header>
<div class="wrap"><div id="loading" class="card loading">Loading your study mode...</div><div id="study" class="card" style="display:none">
<div class="head"><div><h2 style="margin:0">JOA IT Free Mock Test — Study Mode</h2><div style="color:#6b7280;font-size:13px;margin-top:5px">Read-only review of your attempted test</div></div><span class="badge" id="counter"></span></div>
<div class="q" id="en"></div><div class="hi" id="hi"></div>
<div class="options" id="options"></div>
<div class="result-box" id="resultBox"><span id="result"></span></div>
<div class="explanation" id="explainBox" style="display:none"><div class="label">Explanation</div><div id="explanation"></div></div>
<div class="controls"><button class="btn secondary" id="prev">Previous</button><button class="btn primary" id="next">Next</button></div>
</div></div>
<script type="module">
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {doc,getDoc} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import {auth,db} from "./firebase-config.js";
import {questions} from "./joa-question-bank.js";
const $=id=>document.getElementById(id), SID="_joa_free_test_01";let idx=0,answers={};
onAuthStateChanged(auth,async u=>{
 if(!u){location.href="firebase-login.html";return}
 try{const s=await getDoc(doc(db,"testAttempts",u.uid+SID));if(!s.exists()){ $("loading").innerHTML="<h3>No attempted test found.</h3><p>Please attempt the free mock test first.</p><a class='btn primary' href='joa-free-test.html'>Start Free Test</a>";return}
 const d=s.data();answers=d.answers||{};$("loading").style.display="none";$("study").style.display="block";render();
 }catch(e){console.error(e);$("loading").textContent="Unable to load your study data. Please refresh."}
});
function textAnswer(k,q){return k?`${k}. ${q[k]||"[Option]"}`:"Not Answered"}
function render(){const q=questions[idx];if(!q){$("en").textContent="Question not found.";return}
$("counter").textContent=`Question ${idx+1} of ${questions.length}`;
$("en").textContent=q.en||"[English question will be added here]";$("hi").textContent=q.hi||"[Hindi question will be added here]";
const ya=Array.isArray(answers)?(answers[idx]||""):(answers[idx]||"");
const optionBox=$("options");optionBox.innerHTML="";
["A","B","C","D"].forEach(letter=>{
  const div=document.createElement("div");
  div.className="option"+(ya===letter?" selected":"")+(q.ans===letter?" correct-option":"");
  div.innerHTML=`<span class="option-letter">${letter}.</span>${q[letter]||"[Option will be added here]"}`;
  optionBox.appendChild(div);
});
const ok=ya && q.ans && ya===q.ans;$("result").textContent=!ya?"Not Answered":ok?"✓ Correct":"✗ Incorrect";$("resultBox").className="result-box "+(ok?"correct":ya?"wrong":"");
if(q.explanation){$("explainBox").style.display="block";$("explanation").textContent=q.explanation}else $("explainBox").style.display="none";
$("prev").disabled=idx===0;$("next").textContent=idx===questions.length-1?"Back to Series":"Next";
}
$("prev").onclick=()=>{if(idx>0){idx--;render()}};$("next").onclick=()=>{if(idx<questions.length-1){idx++;render()}else location.href="joa-series.html"};
</script>
</body></html>
