<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HP Patwari Mock Test — Study Mode | HPMockShashtra</title>

<style>
*{box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}

html,body{min-height:100%}

body{
  margin:0;
  background:
    radial-gradient(circle at 15% 0%,rgba(14,140,255,.10),transparent 28%),
    radial-gradient(circle at 85% 5%,rgba(152,88,255,.09),transparent 30%),
    linear-gradient(145deg,#061125,#0b1f3b 55%,#07172d);
  color:#eaf2ff;
}

.wrap{
  width:100%;
  max-width:1440px;
  margin:0 auto;
  padding:34px 28px 24px;
}

.card{
  background:linear-gradient(145deg,#12294d,#0d2040);
  border:1px solid rgba(107,174,255,.14);
  border-radius:18px;
  padding:24px;
  box-shadow:0 14px 35px rgba(0,0,0,.28);
}

#loading{
  min-height:110px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#b9c7d8;
  font-size:14px;
  font-weight:700;
}

.score{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:18px;
  padding:18px 20px;
  min-height:92px;
}

.score-main{display:flex;align-items:center;gap:18px}

.score-text strong{
  display:block;
  font-size:25px;
  line-height:1.05;
  color:#f4f8ff;
}

.score-text .label{
  margin-top:4px;
  color:#8298b5;
  font-size:12px;
  font-weight:600;
}

.question-card{
  padding:28px;
  min-height:560px;
}

.question-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.counter{
  font-weight:800;
  color:#56aaff;
  font-size:13px;
}

.question-status{
  padding:8px 13px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
}

.question-status.correct{
  background:rgba(34,197,94,.14);
  color:#73e6a0;
  border:1px solid rgba(34,197,94,.25);
}

.question-status.incorrect{
  background:rgba(239,68,68,.14);
  color:#ff9b9b;
  border:1px solid rgba(239,68,68,.25);
}

.question-status.unattempted{
  background:rgba(148,163,184,.10);
  color:#b9c7d8;
  border:1px solid rgba(148,163,184,.20);
}

.question{
  font-size:21px;
  font-weight:750;
  line-height:1.5;
  margin-bottom:7px;
  color:#f4f8ff;
}

.hindi{
  font-size:17px;
  line-height:1.55;
  color:#b9c7d8;
  margin-bottom:22px;
}

.options{display:grid;gap:12px}

.option{
  display:flex;
  gap:12px;
  align-items:flex-start;
  border:1px solid rgba(107,174,255,.16);
  border-radius:13px;
  padding:14px 16px;
  line-height:1.5;
  background:linear-gradient(145deg,#15345c,#0c2040);
  color:#eaf2ff;
  transition:.18s ease;
}

.option:hover{
  border-color:rgba(94,183,255,.40);
  transform:translateY(-1px);
}

.option.selected-wrong{
  border-color:#ef4444;
  background:rgba(127,29,29,.28);
}

.option.correct,
.option.correct.selected{
  border-color:#22c55e;
  background:rgba(20,83,45,.38);
}

.option input{margin-top:5px;accent-color:#0ea5e9}

.answer-box{
  margin-top:16px;
  padding:13px 15px;
  border-radius:10px;
}

.answer-box.correct{background:rgba(34,197,94,.12);color:#73e6a0}
.answer-box.incorrect{background:rgba(239,68,68,.12);color:#ff9b9b}
.answer-box.unattempted{background:rgba(148,163,184,.10);color:#b9c7d8}

.answer-title{font-weight:900;margin-bottom:6px}
.answer-line{margin:4px 0;font-weight:700}

.explanation{
  margin-top:16px;
  padding:15px 17px;
  border-left:4px solid #0ea5e9;
  background:linear-gradient(145deg,#10294b,#0b213e);
  color:#cbd8e8;
  line-height:1.6;
  border-radius:0 10px 10px 0;
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-top:24px;
  padding-top:18px;
  border-top:1px solid rgba(107,174,255,.10);
}

.btn{
  border:0;
  border-radius:10px;
  padding:12px 20px;
  font-weight:750;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  transition:.18s ease;
}

.primary{
  background:linear-gradient(135deg,#0d8cff,#386cff,#9858ff);
  color:#fff;
  box-shadow:0 8px 22px rgba(56,108,255,.22);
}

.primary:hover{transform:translateY(-1px);filter:brightness(1.06)}

.secondary{
  background:#15345c;
  color:#d9e7f8;
  border:1px solid rgba(107,174,255,.16);
}

.secondary:hover{background:#1a3e6b}

.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}

.page-indicator{
  font-size:13px;
  font-weight:800;
  color:#8298b5;
}

.error{
  text-align:center;
  color:#ff9b9b;
}

.hidden{display:none!important}

.site-footer{
  width:100%;
  margin:0;
  background:linear-gradient(145deg,#061125,#0b1f3b);
  border-top:1px solid rgba(107,174,255,.12);
  color:#fff;
}

.footer-inner{
  max-width:1440px;
  min-height:70px;
  margin:auto;
  padding:18px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.copyright{font-size:12px;font-weight:600;color:#8298b5}
.footer-links{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.footer-links a{color:#b9c7d8!important;text-decoration:none;font-size:12px;font-weight:700}
.footer-links a:hover{color:#fff!important}

@media(max-width:700px){
  .wrap{padding:18px 12px 18px}
  .card{padding:18px}
  .question-card{padding:18px;min-height:0}
  .question-head{align-items:flex-start}
  .question{font-size:18px}
  .hindi{font-size:16px}
  .controls{flex-direction:column}
  .btn{width:100%;text-align:center}
  .page-indicator{order:-1}
  .footer-inner{padding:16px 18px;flex-direction:column;align-items:flex-start}
}
</style>
</head>

<body>



<div class="wrap">
<div id="loading" class="card">
    Loading your attempted test...
  </div>

  <div id="reviewArea" class="hidden">
<div class="card question-card">
      <div class="question-head">
        <div class="counter" id="counter"></div>
        <div id="questionStatus" class="question-status"></div>
      </div>
      <div class="question" id="questionEn"></div>
      <div class="hindi" id="questionHi"></div>
      <div class="options" id="options"></div>
      <div id="answerBox" class="answer-box hidden" style="display:none!important"></div>
      <div id="explanation" class="explanation hidden"></div>
      <div class="controls">
        <button class="btn secondary" id="prevBtn">Previous</button>
        <div class="page-indicator" id="pageIndicator"></div>
        <button class="btn primary" id="nextBtn">Next</button>
      </div>
    </div>

  </div>

  <div id="errorArea" class="card error hidden"></div>

</div>


<footer class="site-footer">
  <div class="footer-inner">
    <div class="copyright">© 2026 HPMockShashtra. All Rights Reserved.</div>
    <div class="footer-links">
      <a href="../about.html">About</a>
      <a href="../privacy.html">Privacy Policy</a>
      <a href="../terms.html">Terms &amp; Conditions</a>
    </div>
  </div>
</footer>

<script type="module">

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { auth, db } from "../firebase-config.js";

const TEST_ID = new URLSearchParams(window.location.search).get("test")
  || "patwari_free_test_01";

const TEST_CONFIG = {
  patwari_free_test_01: {
    name: "HP Patwari Free Mock Test",
    testPage: "patwari-free-test.html",
    questionBank: "./patwari-question-bank.js"
  },
  joa_test_01: {
    name: "JOA IT Mock Test 01",
    testPage: "joa-test-01.html",
    questionBank: "./joa-test-01.js"
  },
  joa_test_02: {
    name: "JOA IT Mock Test 02",
    testPage: "joa-test-02.html",
    questionBank: "./joa-test-02.js"
  },
  joa_test_03: {
    name: "JOA IT Mock Test 03",
    testPage: "joa-test-03.html",
    questionBank: "./joa-test-03.js"
  },
  joa_test_04: {
    name: "JOA IT Mock Test 04",
    testPage: "joa-test-04.html",
    questionBank: "./joa-test-04.js"
  },
  joa_test_05: {
    name: "JOA IT Mock Test 05",
    testPage: "joa-test-05.html",
    questionBank: "./joa-test-05.js"
  },
  joa_test_06: {
    name: "JOA IT Mock Test 06",
    testPage: "joa-test-06.html",
    questionBank: "./joa-test-06.js"
  },
  joa_test_07: {
    name: "JOA IT Mock Test 07",
    testPage: "joa-test-07.html",
    questionBank: "./joa-test-07.js"
  },
  joa_test_08: {
    name: "JOA IT Mock Test 08",
    testPage: "joa-test-08.html",
    questionBank: "./joa-test-08.js"
  },
  joa_test_09: {
    name: "JOA IT Mock Test 09",
    testPage: "joa-test-09.html",
    questionBank: "./joa-test-09.js"
  },
  joa_test_10: {
    name: "JOA IT Mock Test 10",
    testPage: "joa-test-10.html",
    questionBank: "./joa-test-10.js"
  },
  joa_test_11: {
    name: "JOA IT Mock Test 11",
    testPage: "joa-test-11.html",
    questionBank: "./joa-test-11.js"
  },
  joa_test_12: {
    name: "JOA IT Mock Test 12",
    testPage: "joa-test-12.html",
    questionBank: "./joa-test-12.js"
  },
  joa_test_13: {
    name: "JOA IT Mock Test 13",
    testPage: "joa-test-13.html",
    questionBank: "./joa-test-13.js"
  },
  joa_test_14: {
    name: "JOA IT Mock Test 14",
    testPage: "joa-test-14.html",
    questionBank: "./joa-test-14.js"
  },
  joa_test_15: {
    name: "JOA IT Mock Test 15",
    testPage: "joa-test-15.html",
    questionBank: "./joa-test-15.js"
  }
};

const config = TEST_CONFIG[TEST_ID];

if (!config) {
  throw new Error("Invalid test ID.");
}

const { questions } = await import(config.questionBank);
const ATTEMPT_ID_SUFFIX = "_" + TEST_ID;

const $ = id => document.getElementById(id);

let user = null;
let attempt = null;
let answers = {};
let current = 0;

$("pageTitle").textContent = `${config.name} — Study Mode`;

onAuthStateChanged(auth, async (u) => {

  if(!u){
    location.href = "../firebase-login.html";
    return;
  }

  user = u;

  try{

    const attemptRef = doc(
      db,
      "testAttempts",
      user.uid + ATTEMPT_ID_SUFFIX
    );

    const snap = await getDoc(attemptRef);

    if(!snap.exists()){
      $("loading").classList.add("hidden");

      $("errorArea").classList.remove("hidden");
      $("errorArea").innerHTML = `
        <h2>No Attempt Found</h2>
        <p id="noAttemptText">You have not completed this mock test yet.</p>
        <br>
        <a class="btn primary" id="goToTest" href="${config.testPage}">Go to Test</a>
        <a class="btn secondary" href="patwari-series.html">Back to Series</a>
      `;

      return;
    }

    attempt = snap.data();

    if(attempt.testId !== TEST_ID){
      throw new Error("Invalid test record for this Study Mode.");
    }

    answers = attempt.answers || {};
    current = 0;

    $("score").textContent =
      `${attempt.score ?? 0}/${attempt.total ?? questions.length}`;

    $("percentage").textContent =
      `Percentage: ${attempt.percentage ?? 0}%`;

    $("loading").classList.add("hidden");
    $("reviewArea").classList.remove("hidden");

    updateSummary();
    render();

  }catch(e){

    console.error(e);

    $("loading").classList.add("hidden");
    $("errorArea").classList.remove("hidden");

    $("errorArea").innerHTML = `
      <h2>Unable to Load Study Mode</h2>
      <p>Please refresh the page and try again.</p>
      <br>
      <a class="btn secondary" href="patwari-series.html">Back to Series</a>
    `;
  }

});


function render(){

  if(!questions.length){
    $("errorArea").classList.remove("hidden");
    $("errorArea").innerHTML = "<h2>Question bank is empty.</h2>";
    return;
  }

  const q = questions[current];
  const selected = answers[current];
  const correct = q.ans;
  const attempted = !!selected;
  const isCorrectAnswer = attempted && selected === correct;

  $("counter").textContent = `Question ${current + 1} of ${questions.length}`;
  $("questionEn").textContent = q.en || "[English question not available]";
  $("questionHi").textContent = q.hi || "[Hindi question not available]";

  const status = $("questionStatus");
  status.className = "question-status";

  if(!attempted){
    status.classList.add("unattempted");
    status.textContent = "− Not Attempted";
  }else if(isCorrectAnswer){
    status.classList.add("correct");
    status.textContent = "✓ Correct";
  }else{
    status.classList.add("incorrect");
    status.textContent = "✕ Incorrect";
  }

  $("options").innerHTML = ["A","B","C","D"].map(k => {
    const isCorrect = correct === k;
    const isSelected = selected === k;
    let className = "option";

    // Show answers only through colour:
    // Correct answer = GREEN
    // Wrong selected answer = RED
    if(isCorrect){
      className += " correct";
      if(isSelected) className += " selected";
    }else if(isSelected){
      className += " selected-wrong";
    }

    return `
      <div class="${className}">
        <input type="radio" disabled ${isSelected ? "checked" : ""}>
        <span><strong>${k}.</strong> ${q[k] || "[Option not available]"}</span>
      </div>
    `;
  }).join("");

  // Answer text box intentionally hidden.
  // Study Mode uses only GREEN/RED option colours to show the result.

  const explanation = $("explanation");
  if(q.explanation){
    explanation.classList.remove("hidden");
    explanation.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
  }else{
    explanation.classList.add("hidden");
    explanation.textContent = "";
  }

  $("prevBtn").disabled = current === 0;
  $("nextBtn").textContent = current === questions.length - 1 ? "Back to Series" : "Next";
  $("pageIndicator").textContent = `Question ${current + 1} of ${questions.length}`;
}

function updateSummary(){

  let correctCount = 0;
  let wrongCount = 0;
  let unattemptedCount = 0;

  questions.forEach((q,index) => {
    const selected = answers[index];

    if(!selected) unattemptedCount++;
    else if(selected === q.ans) correctCount++;
    else wrongCount++;
  });

  const total = questions.length;
  const percentage = total ? Math.round((correctCount / total) * 100) : 0;

  $("correctCount").textContent = correctCount;
  $("wrongCount").textContent = wrongCount;
  $("unattemptedCount").textContent = unattemptedCount;

  $("score").textContent = `${correctCount}/${total}`;
  $("percentage").textContent = `Percentage: ${percentage}%`;
  $("scoreRing").style.setProperty("--score", `${percentage}%`);
  $("scoreRingText").textContent = `${percentage}%`;
}

$("prevBtn").onclick = () => {

  if(current > 0){

    current--;
    render();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

};


$("nextBtn").onclick = () => {

  if(current < questions.length - 1){

    current++;
    render();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }else{

    location.href = "patwari-series.html";

  }

};

</script>

</body>
</html>
